# Déploie le jeu sur l'hébergement OVH (www.arthurlaheyne.fr/patouchlamouch/) à chaque push sur main.
#
# Secrets à créer dans GitHub (Settings > Secrets and variables > Actions) :
#   FTP_SERVER     ex. ftp.clusterXXX.hosting.ovh.net (espace client OVH > Hébergement > FTP-SSH)
#   FTP_USERNAME   login FTP
#   FTP_PASSWORD   mot de passe FTP
#   LEVEL_PASSWORD mot de passe demandé par la Sandbox pour enregistrer un niveau
#
# Seuls les fichiers modifiés sont envoyés (état gardé sur le serveur dans .ftp-deploy-sync-state.json).
# data/ (niveaux enregistrés depuis la Sandbox) n'est jamais touché.
name: Déploiement OVH

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérification de la syntaxe
        run: |
          php -l save-level.php
          for f in *.js; do node --check --input-type=module < "$f"; done
          python3 -c "import json; json.load(open('levels.json'))"

      - name: Génération de la configuration de save-level.php
        env:
          LEVEL_PASSWORD: ${{ secrets.LEVEL_PASSWORD }}
        run: |
          test -n "$LEVEL_PASSWORD" || { echo "Secret LEVEL_PASSWORD manquant"; exit 1; }
          php -r '$h = password_hash(getenv("LEVEL_PASSWORD"), PASSWORD_DEFAULT); echo "<?php\nreturn [\"password_hash\" => " . var_export($h, true) . "];\n";' > save-level.config.php

      - name: Envoi FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: www/patouchlamouch/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            node_modules/**
            data/**
            export-dynamodb-*/**
            package.json
            package-lock.json
            assets/*.xcf
