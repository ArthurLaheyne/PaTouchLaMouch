# Déploie le jeu sur l'hébergement OVH (www.arthurlaheyne.fr/patouchlamouch/) à chaque push sur main,
# après les tests (job "tests").
#
# Secrets à créer dans GitHub (Settings > Secrets and variables > Actions) :
#   FTP_USERNAME   login FTP-SSH OVH (espace client OVH > Hébergement > FTP-SSH)
#   FTP_PASSWORD   mot de passe de ce login
#   LEVEL_PASSWORD mot de passe demandé par la Sandbox pour enregistrer un niveau
#
# Envoi en SFTP (OVH ne gère pas le FTPS). Les dates des fichiers sont celles de leur dernier commit,
# ce qui permet à lftp de ne renvoyer que les fichiers modifiés.
# data/ (niveaux enregistrés depuis la Sandbox) n'est jamais touché. Seuls sont supprimés du serveur les fichiers
# retirés de git par les commits de ce push (git diff entre le commit d'avant le push et le nouveau).
name: Déploiement OVH

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  SFTP_HOST: ssh.cluster029.hosting.ovh.net
  SFTP_HOST_KEY: ssh.cluster029.hosting.ovh.net ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPHzGPnvg+XUpaMELjQ4AIj/6pkjvvHYCUxDVpcdaC8T
  REMOTE_DIR: www/patouchlamouch

jobs:
  # Tests du jeu, de l'éditeur et de l'API dans un vrai navigateur (voir tests/) : le déploiement n'a lieu que s'ils passent
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installation de Playwright et de Chromium
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Tests
        run: npm test

  deploy:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vérification de la syntaxe
        run: |
          php -l api/save-level.php
          find src -name '*.js' -print0 | while IFS= read -r -d '' f; do node --check --input-type=module < "$f"; done
          python3 -c "import json; json.load(open('levels.json'))"

      - name: Dates des fichiers = date du dernier commit
        run: |
          git ls-files -z | while IFS= read -r -d '' f; do
            touch -d "@$(git log -1 --format=%ct -- "$f")" "$f"
          done

      - name: Génération de la configuration de save-level.php
        env:
          LEVEL_PASSWORD: ${{ secrets.LEVEL_PASSWORD }}
        run: |
          test -n "$LEVEL_PASSWORD" || { echo "Secret LEVEL_PASSWORD manquant"; exit 1; }
          php -r '$h = password_hash(getenv("LEVEL_PASSWORD"), PASSWORD_DEFAULT); echo "<?php\nreturn [\"password_hash\" => " . var_export($h, true) . "];\n";' > api/save-level.config.php

      - name: Fichiers retirés de git par ce push
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          : > "$RUNNER_TEMP/suppressions.lftp"
          # Pas de commit précédent (lancement manuel, nouvelle branche) : rien à supprimer
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "Aucune suppression"; exit 0
          fi
          git diff --name-only --no-renames --diff-filter=D "$BEFORE" "$GITHUB_SHA" | while IFS= read -r f; do
            case "$f" in
              data/*|.github/*|tests/*|*..*|*\'*|*\"*|'') continue ;;  # jamais déployés, ou chemin suspect
            esac
            echo "Suppression : $f"
            echo "rm -f \"$REMOTE_DIR/$f\"" >> "$RUNNER_TEMP/suppressions.lftp"
          done

      - name: Envoi SFTP
        env:
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }} # lu par lftp via --env-password
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp > /dev/null
          mkdir -p ~/.ssh
          echo "$SFTP_HOST_KEY" > ~/.ssh/known_hosts
          lftp -c "
            set net:max-retries 2
            set net:timeout 20
            set sftp:connect-program 'ssh -a -x -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts'
            open --user \"$SFTP_USER\" --env-password sftp://$SFTP_HOST
            mirror --reverse --verbose --no-perms \
              --exclude '^\.git/' \
              --exclude '^\.github/' \
              --exclude '^\.gitignore$' \
              --exclude '^node_modules/' \
              --exclude '^data/' \
              --exclude '^export-dynamodb-' \
              --exclude '^package(-lock)?\.json$' \
              --exclude '\.xcf$' \
              --exclude '^tests/' \
              ./ $REMOTE_DIR
            source $RUNNER_TEMP/suppressions.lftp
          "
